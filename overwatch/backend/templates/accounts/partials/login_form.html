<form
    hx-post="{% url 'accounts:auth-login-htmx' %}"
    hx-target="this"
    hx-swap="outerHTML"
    class="login-form">

    {% csrf_token %}

    {% if error %}
        <div class="alert alert-error">
            <span class="alert-icon">&#9888;</span>
            {{ error }}
        </div>
    {% endif %}

    <div class="form-group">
        <label for="username">Username</label>
        <input
            id="username"
            name="username"
            type="text"
            value="{{ form.username.value|default:'' }}"
            placeholder="Enter username"
            required
            autofocus
            autocomplete="username"
        />
        {% if form.username.errors %}
            <div class="text-error text-sm">{{ form.username.errors.0 }}</div>
        {% endif %}
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            required
            autocomplete="current-password"
        />
        {% if form.password.errors %}
            <div class="text-error text-sm">{{ form.password.errors.0 }}</div>
        {% endif %}
    </div>

    <button
        type="submit"
        class="btn btn-primary btn-block"
        hx-indicator="#login-spinner"
        hx-disabled-elt="this">
        <span id="login-text">Sign In</span>
        <span id="login-spinner" class="htmx-indicator">
            <span class="loading-spinner"></span> Authenticating...
        </span>
    </button>
</form>
