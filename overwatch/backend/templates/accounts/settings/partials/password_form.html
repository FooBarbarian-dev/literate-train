<form hx-post="{% url 'accounts:change-password-htmx' %}"
      hx-target="#password-form-container"
      hx-swap="innerHTML">
    {% csrf_token %}

    {% if message %}
        <div class="alert alert-{{ message_type|default:'success' }}">{{ message }}</div>
    {% endif %}

    <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="current_password" required autocomplete="current-password" />
    </div>

    <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" required autocomplete="new-password" />
    </div>

    <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required autocomplete="new-password" />
    </div>

    <button type="submit" class="btn btn-primary" hx-indicator="#pw-spinner" hx-disabled-elt="this">
        <span id="pw-text">Change Password</span>
        <span id="pw-spinner" class="htmx-indicator"><span class="loading-spinner"></span> Changing...</span>
    </button>
</form>
