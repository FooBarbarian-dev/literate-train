<div class="modal-overlay" onclick="document.getElementById('modal-container').innerHTML = ''">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2>Configure Card Fields</h2>
            <button class="btn btn-ghost" onclick="document.getElementById('modal-container').innerHTML = ''">&#10005;</button>
        </div>
        <div class="modal-body">
            <p>Select which fields to display on the log cards.</p>
            <form id="card-fields-form" onsubmit="event.preventDefault(); saveCardFields();">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                    <div>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="internal_ip" class="cf-checkbox" checked> Internal IP
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="external_ip" class="cf-checkbox" checked> External IP
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="mac_address" class="cf-checkbox" checked> MAC Address
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="domain" class="cf-checkbox" checked> Domain
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="username" class="cf-checkbox" checked> User
                        </label>
                    </div>
                    <div>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="command" class="cf-checkbox" checked> Command
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="notes" class="cf-checkbox" checked> Notes
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="filename" class="cf-checkbox" checked> Filename
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="status" class="cf-checkbox" checked> Status
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                            <input type="checkbox" value="hash_value" class="cf-checkbox" checked> Hash Value
                        </label>
                    </div>
                </div>

                <div class="modal-actions" style="margin-top: 1.5rem;">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('modal-container').innerHTML = ''">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Configuration</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Initialize checkboxes from localStorage
    try {
        const stored = localStorage.getItem('overwatch-card-fields');
        if (stored) {
            const config = JSON.parse(stored);
            document.querySelectorAll('.cf-checkbox').forEach(cb => {
                cb.checked = config.includes(cb.value);
            });
        }
    } catch(e) {}

    function saveCardFields() {
        const selected = Array.from(document.querySelectorAll('.cf-checkbox:checked')).map(cb => cb.value);
        localStorage.setItem('overwatch-card-fields', JSON.stringify(selected));

        // Close modal
        document.getElementById('modal-container').innerHTML = '';

        // Inform UI to refresh via HTMX
        document.body.dispatchEvent(new Event('logsUpdated'));
    }
</script>
