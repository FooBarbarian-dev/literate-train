<div class="modal-overlay" onclick="document.getElementById('modal-container').innerHTML = ''">
    <div class="modal modal-sm" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2>New Operation</h2>
            <button class="btn btn-ghost" onclick="document.getElementById('modal-container').innerHTML = ''">
                &#10005;
            </button>
        </div>

        <form
            hx-post="{% url 'operations:create-operation-htmx' %}"
            hx-target="this"
            hx-swap="outerHTML"
            class="modal-body">

            {% csrf_token %}

            {% if error %}
                <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <div class="form-group">
                <label>Operation Name</label>
                <input
                    name="name"
                    value="{{ form.name.value|default:'' }}"
                    placeholder="e.g., Operation Thunderstrike"
                    required
                    autofocus
                />
                {% if form.name.errors %}
                    <div class="text-error text-sm">{{ form.name.errors.0 }}</div>
                {% endif %}
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea
                    name="description"
                    placeholder="Operation details..."
                    rows="3"
                >{{ form.description.value|default:'' }}</textarea>
                {% if form.description.errors %}
                    <div class="text-error text-sm">{{ form.description.errors.0 }}</div>
                {% endif %}
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" onclick="document.getElementById('modal-container').innerHTML = ''">
                    Cancel
                </button>
                <button
                    type="submit"
                    class="btn btn-primary"
                    hx-indicator="#saving-spinner"
                    hx-disabled-elt="this">
                    <span id="saving-text">Create Operation</span>
                    <span id="saving-spinner" class="htmx-indicator">
                        <span class="loading-spinner"></span> Creating...
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
